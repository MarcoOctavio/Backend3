paths:

  /api/sessions/register:
    post:
      summary: Register a new user
      tags:
        - Sessions

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - password
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                password:
                  type: string

      responses:
        "200":
          description: User registered successfully
        "400":
          description: Bad request

  /api/sessions/login:
    post:
      summary: Login user
      tags:
        - Sessions

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        "200":
          description: Login successful
        "401":
          description: Unauthorized

  /api/sessions/current:
    get:
      summary: Get current user
      tags:
        - Sessions

      responses:
        "200":
          description: Current logged user

  /api/sessions/unprotectedLogin:
    get:
      summary: Login without authentication (testing)
      tags:
        - Sessions

      responses:
        "200":
          description: Login successful

  /api/sessions/unprotectedCurrent:
    get:
      summary: Get current user without authentication (testing)
      tags:
        - Sessions

      responses:
        "200":
          description: Current user