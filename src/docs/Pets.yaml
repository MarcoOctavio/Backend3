paths:

  /api/pets:
    get:
      summary: Get all pets
      tags:
        - Pets

      responses:
        "200":
          description: List of pets

    post:
      summary: Create a new pet
      tags:
        - Pets

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                specie:
                  type: string
                adopted:
                  type: boolean

      responses:
        "200":
          description: Pet created successfully

  /api/pets/withimage:
    post:
      summary: Create a pet with image upload
      tags:
        - Pets

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                specie:
                  type: string
                image:
                  type: string
                  format: binary

      responses:
        "200":
          description: Pet created with image

  /api/pets/{pid}:
    put:
      summary: Update a pet
      tags:
        - Pets

      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Pet updated

    delete:
      summary: Delete a pet
      tags:
        - Pets

      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Pet deleted