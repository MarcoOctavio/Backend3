components:
  schemas:

    User:
      type: object
      properties:

        _id:
          type: string
          description: User ID generated by MongoDB

        first_name:
          type: string
          description: User first name

        last_name:
          type: string
          description: User last name

        email:
          type: string
          description: User email

        password:
          type: string
          description: Hashed password

        role:
          type: string
          description: User role

        documents:
          type: array
          description: List of uploaded documents
          items:
            type: object
            properties:

              name:
                type: string
                description: Document name

              reference:
                type: string
                description: Path to stored file

        last_connection:
          type: string
          format: date-time
          description: Last login or logout timestamp

      example:

        _id: "67f123abc456"
        first_name: "Marco"
        last_name: "Venegas"
        email: "marco@test.com"
        role: "user"

        documents:
          - name: "dni.pdf"
            reference: "public/documents/171234567-dni.pdf"

        last_connection: "2026-04-11T02:15:30.000Z"